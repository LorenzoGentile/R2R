name: Publish qualified usage receipt image
on:
  push:
    tags: ["usage-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./py
          file: ./py/Dockerfile.receipts
          load: true
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ghcr.io/lorenzogentile/r2r:${{ github.ref_name }}-${{ matrix.arch }}
      - name: Qualify actual runtime with simulated provider calls
        run: |
          docker run --rm \
            -v "$PWD/py/tests/unit/usage:/qualification:ro" \
            --entrypoint sh \
            ghcr.io/lorenzogentile/r2r:${{ github.ref_name }}-${{ matrix.arch }} \
            -ec 'pip install --no-cache-dir pytest==8.3.5 pytest-asyncio==0.23.8 >/dev/null; python -m pytest /qualification --confcutdir=/qualification -o asyncio_mode=auto -p no:cacheprovider -q'
      - name: Push qualified architecture
        run: docker push ghcr.io/lorenzogentile/r2r:${{ github.ref_name }}-${{ matrix.arch }}
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/lorenzogentile/r2r:${{ github.ref_name }} \
            ghcr.io/lorenzogentile/r2r:${{ github.ref_name }}-amd64 \
            ghcr.io/lorenzogentile/r2r:${{ github.ref_name }}-arm64
          docker buildx imagetools inspect ghcr.io/lorenzogentile/r2r:${{ github.ref_name }} >> "$GITHUB_STEP_SUMMARY"
